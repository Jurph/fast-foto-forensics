codecov:
  slug: "Jurph/fast-foto-forensics"
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "50...100"
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "tests/**"
  - "**/conftest.py"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
