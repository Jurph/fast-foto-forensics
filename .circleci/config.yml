version: 2.1

# CircleCI setup reminder:
# 1. Open https://app.circleci.com/ and select the fast-foto-forensics project.
# 2. Go to Project Settings -> Environment Variables.
# 3. Add a variable named CODECOV_TOKEN.
# 4. Paste the repo token from Codecov and save.
# Until that variable exists, this config will still run tests but will skip the Codecov upload.

jobs:
  test:
    docker:
      - image: cimg/python:3.11

    steps:
      - checkout

      - restore_cache:
          keys:
            - venv-v1-{{ checksum "pyproject.toml" }}
            - venv-v1-

      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            venv/bin/pip install --upgrade pip
            venv/bin/pip install -e ".[dev,ci]"

      - save_cache:
          key: venv-v1-{{ checksum "pyproject.toml" }}
          paths:
            - venv

      - run:
          name: Run tests with coverage
          command: |
            mkdir -p test-results
            source venv/bin/activate
            pytest \
              --cov=src/fast_foto_forensics \
              --cov-report=xml:coverage.xml \
              --cov-report=term \
              --junitxml=test-results/junit.xml

      - run:
          name: Upload coverage to Codecov
          command: |
            source venv/bin/activate
            if [ -z "${CODECOV_TOKEN:-}" ]; then
              echo "CODECOV_TOKEN not set; skipping Codecov upload."
              echo "CircleCI clicks: Project Settings -> Environment Variables -> Add Variable."
            else
              echo "Starting Codecov upload..."
              if codecovcli do-upload \
                --token="$CODECOV_TOKEN" \
                --sha="$CIRCLE_SHA1" \
                --git-service=github \
                --slug=Jurph/fast-foto-forensics \
                --plugin pycoverage \
                --file=coverage.xml \
                --disable-search \
                --fail-on-error; then
                echo "Codecov upload completed successfully."
              else
                echo "Codecov upload failed."
                exit 1
              fi
            fi

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: coverage.xml

workflows:
  test-workflow:
    jobs:
      - test
